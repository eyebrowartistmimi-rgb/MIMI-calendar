<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ともこ皮フクリニック | 空き枠カレンダー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FBF2EE;
    --bg-soft: #F5E5DE;
    --card: #FFFFFF;
    --rose: #B85559;
    --rose-deep: #953f42;
    --gold: #C9A661;
    --gold-soft: #E8D7AE;
    --ink: #4A3733;
    --ink-muted: #9C8880;
    --closed: #EDE1DC;
    --closed-text: #C2AFA8;
    --line-green: #06C755;
    --shadow: 0 12px 32px -12px rgba(149, 63, 66, 0.22);
    --radius: 18px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Zen Kaku Gothic New', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    background:
      radial-gradient(ellipse 600px 300px at 100% -10%, var(--gold-soft) 0%, transparent 60%),
      radial-gradient(ellipse 500px 260px at -10% 0%, var(--bg-soft) 0%, transparent 55%),
      var(--bg);
    padding-bottom: 48px;
    position: relative;
    overflow: hidden;
  }

  /* ---- Header ---- */
  header {
    padding: 36px 24px 20px;
    text-align: center;
    position: relative;
  }

  .eyebrow {
    font-size: 11px;
    letter-spacing: 0.28em;
    color: var(--gold);
    font-weight: 700;
    margin-bottom: 10px;
  }

  h1 {
    font-family: 'Shippori Mincho', serif;
    font-size: 25px;
    font-weight: 700;
    margin: 0 0 6px;
    color: var(--rose-deep);
    letter-spacing: 0.02em;
  }

  .sub {
    font-size: 12.5px;
    color: var(--ink-muted);
    margin-bottom: 22px;
    letter-spacing: 0.02em;
  }

  .hours-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px 18px;
    text-align: left;
    border: 1px solid rgba(201,166,97,0.25);
  }

  .hours-title {
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--gold);
    font-weight: 700;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .hours-title::before { content: "◆"; font-size: 9px; }

  .hours-row {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    padding: 6px 0;
    border-top: 1px dashed rgba(156,136,128,0.25);
  }
  .hours-row:first-of-type { border-top: none; }
  .hours-row .d { font-weight: 700; color: var(--ink); min-width: 70px; }
  .hours-row .t { color: var(--ink-muted); text-align: right; }

  .hours-note {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed rgba(156,136,128,0.25);
    font-size: 11.5px;
    color: var(--rose);
    line-height: 1.6;
  }

  /* ---- Menu select ---- */
  .menu-section { padding: 22px 20px 0; }

  .menu-lead {
    font-size: 12.5px;
    color: var(--ink-muted);
    text-align: center;
    margin-bottom: 16px;
  }

  .menu-card {
    background: var(--card);
    border: 1px solid rgba(201,166,97,0.3);
    border-radius: 14px;
    padding: 14px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    cursor: pointer;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .menu-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
  .menu-card:active { transform: scale(0.98); }
  .menu-card .m-label {
    font-size: 13.5px;
    font-weight: 700;
    color: var(--ink);
  }
  .menu-card .m-time {
    font-size: 11.5px;
    color: var(--gold);
    font-weight: 700;
    white-space: nowrap;
    margin-left: 10px;
  }

  .change-menu {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11.5px;
    color: var(--rose);
    cursor: pointer;
    margin-bottom: 14px;
    text-decoration: underline;
    text-decoration-color: rgba(184,85,89,0.4);
  }

  .selected-menu-chip {
    background: var(--gold-soft);
    color: var(--rose-deep);
    font-size: 11.5px;
    font-weight: 700;
    padding: 6px 12px;
    border-radius: 20px;
    display: inline-block;
    margin-bottom: 14px;
  }

  .hidden { display: none !important; }

  /* ---- Counseling form / Retouch notice ---- */
  .form-section, .retouch-section {
    padding: 22px 20px 0;
  }

  .form-title {
    font-family: 'Shippori Mincho', serif;
    font-size: 16px;
    font-weight: 700;
    color: var(--rose-deep);
    margin-bottom: 4px;
  }

  .form-sub {
    font-size: 11.5px;
    color: var(--ink-muted);
    margin-bottom: 16px;
  }

  .form-label {
    display: block;
    font-size: 11.5px;
    font-weight: 700;
    color: var(--ink);
    margin: 14px 0 6px;
  }

  .form-input, .form-textarea {
    width: 100%;
    border: 1px solid rgba(201,166,97,0.4);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
    font-family: 'Zen Kaku Gothic New', sans-serif;
    color: var(--ink);
    background: #fff;
  }
  .form-textarea { resize: vertical; }
  .form-input:focus, .form-textarea:focus {
    outline: none;
    border-color: var(--rose);
  }

  .form-error {
    font-size: 11px;
    color: var(--rose-deep);
    margin-top: 6px;
    display: none;
  }
  .form-error.show { display: block; }

  .submit-btn {
    width: 100%;
    margin-top: 18px;
    background: var(--rose);
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 13px;
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
    transition: transform .12s ease, background .15s ease;
  }
  .submit-btn:hover { background: var(--rose-deep); }
  .submit-btn:active { transform: scale(0.98); }

  .form-note {
    margin-top: 12px;
    font-size: 11px;
    color: var(--ink-muted);
    line-height: 1.6;
    text-align: center;
  }

  .retouch-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 18px;
    border: 1px solid rgba(201,166,97,0.25);
  }
  .retouch-card p {
    font-size: 13px;
    color: var(--ink);
    line-height: 1.8;
    margin: 0 0 16px;
  }

  /* ---- Calendar ---- */
  .cal-section { padding: 22px 20px 0; }

  .cal-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }

  .cal-nav button {
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 1px solid rgba(201,166,97,0.4);
    background: var(--card);
    color: var(--rose-deep);
    font-size: 15px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform .15s ease, background .15s ease;
  }
  .cal-nav button:hover { background: var(--gold-soft); }
  .cal-nav button:active { transform: scale(0.92); }
  .cal-nav button:disabled { opacity: 0.3; cursor: default; }

  .cal-month {
    font-family: 'Shippori Mincho', serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: 0.03em;
  }

  .weekday-row {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    text-align: center;
    font-size: 11px;
    color: var(--ink-muted);
    margin-bottom: 6px;
    font-weight: 700;
  }
  .weekday-row span:first-child { color: var(--rose); }
  .weekday-row span:last-child { color: var(--gold); }

  .day-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 5px;
  }

  .day-cell {
    aspect-ratio: 1 / 1;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    background: var(--card);
    border: 1px solid rgba(201,166,97,0.16);
    color: var(--ink);
    cursor: pointer;
    position: relative;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .day-cell.empty { visibility: hidden; cursor: default; }
  .day-cell.closed {
    background: var(--closed);
    color: var(--closed-text);
    cursor: default;
    border: 1px solid transparent;
  }
  .day-cell.past {
    color: var(--closed-text);
    cursor: default;
    opacity: 0.5;
  }
  .day-cell.available:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 14px -6px rgba(149,63,66,0.35);
  }
  .day-cell.selected {
    background: var(--rose);
    color: #fff;
    border-color: var(--rose);
  }
  .day-cell .num { font-weight: 600; }
  .day-cell .dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--gold);
    margin-top: 3px;
  }
  .day-cell.selected .dot { background: #fff; }
  .day-cell.today .num {
    text-decoration: underline;
    text-decoration-color: var(--gold);
    text-decoration-thickness: 2px;
    text-underline-offset: 3px;
  }
  .day-cell .closed-label {
    font-size: 8px;
    margin-top: 2px;
    letter-spacing: 0.02em;
  }

  .legend {
    display: flex;
    gap: 14px;
    justify-content: center;
    margin-top: 16px;
    font-size: 10.5px;
    color: var(--ink-muted);
  }
  .legend span { display: flex; align-items: center; gap: 5px; }
  .legend i { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
  .legend .i-avail { background: var(--gold); }
  .legend .i-closed { background: var(--closed-text); }

  /* ---- Detail panel ---- */
  .detail {
    margin: 22px 20px 0;
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px;
    border: 1px solid rgba(201,166,97,0.25);
    display: none;
  }
  .detail.show {
    display: block;
    animation: rise .28s ease;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .detail-date {
    font-family: 'Shippori Mincho', serif;
    font-size: 16px;
    font-weight: 700;
    color: var(--rose-deep);
    margin-bott
